[project]
name = "figrag"
version = "0.1.0"
description = "Figure-aware RAG over CV papers - Phase 0 text-only baseline"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.116",
    "numpy>=1.26",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pymupdf>=1.24",
    "requests>=2.31",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
figrag = "figrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/figrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs Postgres, an indexed corpus and Anthropic credentials"]
