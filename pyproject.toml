[project]
name = "lacuna"
version = "0.1.0"
description = "Agentic literature-review assistant over a scholarly knowledge graph, with every claim measured"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
    "neo4j>=5.28",
    "numpy>=1.26",
    "openai>=1.60",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.8"]

[project.scripts]
lacuna = "lacuna.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lacuna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs the Docker services (Postgres, Neo4j) and sometimes API keys; skipped when absent",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs", "evals/datasets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
