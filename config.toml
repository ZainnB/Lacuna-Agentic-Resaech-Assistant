# Frozen Phase 0 baseline config. Every field here feeds the config hash in
# eval/results/<date>_<hash>.json. Do not tune these against the eval set.

[chunking]
tokens = 400
overlap = 80
tokenizer = "BAAI/bge-base-en-v1.5"

[embedding]
model = "BAAI/bge-base-en-v1.5"
device = "mps"          # falls back to cpu if MPS is unavailable
batch_size = 32
query_prefix = "Represent this sentence for searching relevant passages: "

[retrieval]
top_k = 5               # chunks passed to the generator; recall@5
eval_depth = 10         # depth used for MRR@10

[generator]
model = "claude-opus-5"
effort = "low"
max_tokens = 2048

[judge]
model = "claude-opus-5"
effort = "medium"
max_tokens = 2048

[db]
dsn = "postgresql://figrag:figrag@localhost:5433/figrag"
